<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Mikrolet — microlet routes &amp; offline map</title>
<meta name="description" content="Mikrolet finds Dili microlet routes, areas and landmarks. Download the Dili mobility pack and use core route information offline. Unofficial proof of concept — data pending review.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<!-- iOS Home Screen metadata -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mikrolet">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* =====================================================================
   Mikrolet — Timor-Leste flag design system, v1.5.0 (skill-applied)
   Colors (60/30/10): white page (~60%), black text/controls (~30%),
   red CTA + yellow highlights (~10%) — alpha tints of those only.
   Type: ONE family (system sans), exactly FOUR sizes and TWO weights:
     --fs-d 40 display · --fs-t 21 titles · --fs-b 17 body · --fs-c 13 caption
     weight 400 regular · 700 bold — hierarchy via size + opacity.
   Spacing: 8-point grid (4/8/12/16/20/24/32/40/48). Radius scale:
     --rad-s 12 controls · --rad-l 20 surfaces · pills for chips.
   Shadows: soft, tinted to the surface — never harsh gray edges.
   Status is carried by labels, icons, borders and wording — never by
   color alone. All motion is gated by prefers-reduced-motion.
   ===================================================================== */
:root{
  --paper:#FFFFFF;            /* 60% — page + map background */
  --ink:#000000;              /* 30% — text, icons, route lines, controls */
  --apri:#FFC72C;             /* 10% — flag yellow: highlights, guidance, progress */
  --red:#DA291C;              /* 10% — flag red: the main action + active accents */
  --on-red:#FFFFFF;           /* text on red (4.8:1) */
  --ink-2:rgba(0,0,0,.64);    /* secondary text: opacity hierarchy, not a new color */
  --hair:rgba(0,0,0,.16);     /* hairline dividers / quiet borders */
  --tint:rgba(0,0,0,.06);     /* pressed / track tint */
  --apri-tint:rgba(255,199,44,.16); /* yellow tint — highlighted surfaces */
  --apri-hint:rgba(255,199,44,.08); /* 5%-style accent wash on secondary elements */
  --on-apri:#000000;          /* constant: text on yellow in both modes (14.6:1) */
  --scrim:rgba(0,0,0,.55);
  --sh-1:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.07);   /* resting surfaces */
  --sh-2:0 12px 32px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.08);  /* floating surfaces */
  --sh-up:0 -10px 24px rgba(0,0,0,.09);                          /* dock / sheet top edge */
  --glow:0 0 0 4px rgba(255,199,44,.22);                         /* success halo */
  --nav-h:88px;
  --rad-s:12px;               /* controls: buttons, chips, inputs */
  --rad-l:20px;               /* surfaces: cards, sheet, banners, search */
  --f:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,Arial,sans-serif;
  --fs-d:40px; --fs-t:21px; --fs-b:17px; --fs-c:13px;
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#000000;            /* black page in dark mode — same flag hues */
  --ink:#FFFFFF;              /* white ink */
  --ink-2:rgba(255,255,255,.68);
  --hair:rgba(255,255,255,.22);
  --tint:rgba(255,255,255,.1);
  --apri-tint:rgba(255,199,44,.16);
  --apri-hint:rgba(255,199,44,.08);
  --scrim:rgba(0,0,0,.72);
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.4);
  --sh-2:0 12px 32px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);
  --sh-up:0 -10px 24px rgba(0,0,0,.55);
}}
/* ============ base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--f);
  background:var(--paper); color:var(--ink);
  font-size:var(--fs-b); line-height:1.5; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.sheet:focus,.sheet:focus-visible{outline:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
/* ============ top app bar — wordmark + quiet pack status ============ */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  height:56px;padding:0 8px;background:var(--paper);border-bottom:1px solid var(--hair);
  padding-top:env(safe-area-inset-top,0px)}
.appbar .title{font-weight:700;font-size:var(--fs-t);flex:1;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1;padding-left:8px}
.appbar .spacer{width:44px;flex:none}
.pstat{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-c);font-weight:400;flex:none;
  border:1px solid var(--hair);border-radius:999px;
  padding:8px 12px;background:transparent;color:var(--ink-2);cursor:pointer;max-width:46%}
.pstat svg{width:14px;height:14px;fill:currentColor;flex:none}
.icon-btn{width:48px;height:48px;border:none;background:transparent;border-radius:var(--rad-s);
  display:inline-flex;align-items:center;justify-content:center;position:relative;
  color:var(--ink);flex:none;overflow:hidden;cursor:pointer}
.icon-btn svg{width:24px;height:24px;fill:currentColor}
/* ============ bottom navigation — plain labels; red pill only when selected ============ */
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--paper);border-top:1px solid var(--hair);z-index:40;
  display:flex;justify-content:space-around;align-items:flex-start}
.navbar button{flex:1;max-width:130px;border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 12px;
  color:var(--ink-2);font-size:var(--fs-c);font-weight:400;position:relative}
.navbar .pill{width:64px;height:36px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s}
.navbar button[aria-current="page"]{color:var(--red);font-weight:700}
.navbar button[aria-current="page"] .pill{background:var(--red);color:var(--on-red)}
.navbar svg{width:26px;height:26px;fill:currentColor}
/* ============ sections — 8-pt rhythm, hairlines, not identical cards ============ */
.view{padding:8px 16px 24px;animation:viewin .22s ease}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{padding:4px 0 0;margin:24px 0;position:relative}
.card.punch,.card.elev{border:none;border-radius:var(--rad-l)}
.card.elev{background:var(--paper);box-shadow:var(--sh-1)}
.card-title{font-weight:700;font-size:var(--fs-t);margin:0 0 8px;letter-spacing:-.01em;line-height:1.25}
.card-sub{font-size:var(--fs-b);color:var(--ink-2);margin:0}
h2.sec{font-weight:700;font-size:var(--fs-c);color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;
  margin:32px 2px 8px;padding-top:16px;border-top:1px solid var(--hair);line-height:1.3}
h2.sec:first-child{border-top:none;padding-top:8px;margin-top:16px}
/* ============ banners — quiet notes; level is written, not colored ============ */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;
  margin:12px 0;font-size:var(--fs-b);line-height:1.45;border-bottom:1px solid var(--hair)}
.banner svg{width:20px;height:20px;fill:currentColor;flex:none;margin-top:2px}
.banner.info,.banner.warn{color:var(--ink-2)}
.banner.warn{border-left:3px solid var(--apri);border-radius:3px;padding-left:12px;color:var(--ink)}
.banner.err{border-left:3px solid var(--red);border-radius:3px;padding-left:12px}
.banner.ok{background:var(--apri-tint);border:none;border-radius:var(--rad-l);
  padding:16px;color:var(--on-apri);box-shadow:var(--glow)}
.banner.ok svg{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
/* ============ lists — plain rows with hairline dividers ============ */
.rrow{display:flex;align-items:center;gap:16px;padding:16px 2px;min-height:72px;
  border-bottom:1px solid var(--hair);cursor:pointer;width:100%;position:relative;overflow:hidden}
.rrow:active{background:var(--tint)}
.rrow .lead{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;
  background:transparent;color:var(--ink);border:1.5px solid var(--ink);
  border-radius:50%;font-weight:700;font-size:var(--fs-b);line-height:1;font-variant-numeric:tabular-nums}
.rrow.isfav .lead,.lead.sel{background:var(--red);color:var(--on-red);border-color:var(--red)}
.rrow .txt{flex:1;min-width:0;display:block}
.rrow .t1{display:block;font-weight:700;font-size:var(--fs-b);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .t2{display:block;font-size:var(--fs-c);color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .trail{color:var(--ink);flex:none}
.list-item{display:flex;align-items:center;gap:16px;padding:12px 2px;min-height:64px;
  position:relative;overflow:hidden;cursor:pointer;width:100%;border:none;background:transparent;
  text-align:left;border-bottom:1px solid var(--hair);border-radius:0}
.list-item:active{background:var(--tint)}
.list-item .lead{width:48px;height:48px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);
  border:1.5px solid var(--ink)}
.list-item .lead svg{width:22px;height:22px;fill:currentColor}
.list-item .txt{flex:1;min-width:0;display:block}
.list-item .t1{display:block;font-size:var(--fs-b);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .t2{display:block;font-size:var(--fs-c);color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .trail{color:var(--ink-2);flex:none}
.list-item svg{width:24px;height:24px;fill:currentColor}
.list-item.static{cursor:default}
/* route numbers attached to a destination row */
.numchips{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.numchip{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;
  padding:0 8px;border:1.5px solid var(--ink);border-radius:999px;
  font-size:var(--fs-c);font-weight:700;color:var(--ink);background:transparent;font-variant-numeric:tabular-nums}
/* ============ landmarks (home) — six places, two quiet columns ============ */
.lm-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
.lm{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;background:transparent;border:none;
  border-radius:var(--rad-s);text-align:left;cursor:pointer;min-width:0}
.lm:active{background:var(--tint)}
.lm .lead{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.lm .lead svg{width:21px;height:21px;fill:currentColor}
.lm .txt{min-width:0;display:block;flex:1}
.lm .t1{display:block;font-size:var(--fs-b);font-weight:700;line-height:1.25;color:var(--ink)}
.lm .t2{display:block;font-size:var(--fs-c);color:var(--ink-2);line-height:1.3}
.lm .numchips{margin-top:8px;gap:4px}
.lm .numchip{min-width:28px;height:24px;padding:0 8px}
/* quiet pointer to the full route list on the map */
.quietlink{display:inline-flex;align-items:center;gap:8px;margin:8px 2px 0;padding:12px 2px;background:transparent;border:none;
  color:var(--ink-2);font-size:var(--fs-b);font-weight:700;cursor:pointer}
.quietlink svg{width:17px;height:17px;fill:currentColor}
.quietlink:active{color:var(--ink)}
/* ============ masthead (home) — the task first, F-pattern ============ */
.mast{padding:24px 2px 8px;position:relative}
.mast .kicker{font-size:var(--fs-c);font-weight:700;color:var(--ink-2);text-transform:uppercase;
  letter-spacing:.08em;margin:0 0 8px}
.mast h1{font-weight:700;font-size:var(--fs-d);line-height:1.08;letter-spacing:-.02em;
  margin:0;max-width:14ch}
.mast .hero-sub{font-size:var(--fs-b);color:var(--ink-2);margin:12px 0 0;max-width:26ch;line-height:1.45}
/* ============ buttons — outlined by default; red fills only key actions ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;
  padding:0 20px;border-radius:var(--rad-s);
  border:1.5px solid var(--ink);font-weight:700;font-size:var(--fs-b);
  cursor:pointer;position:relative;overflow:visible;text-decoration:none;background:transparent;color:var(--ink);
  transition:background .12s,box-shadow .2s}
.btn svg{width:19px;height:19px;fill:currentColor;flex:none}
.btn:active{background:var(--tint)}
.btn.filled,.btn.ink{background:var(--red);color:var(--on-red);border-color:var(--red);box-shadow:var(--sh-1)}
.btn.filled:active,.btn.ink:active{background:var(--red);filter:brightness(.94)}
.btn.filled:disabled,.btn.ink:disabled{background:var(--tint);color:var(--ink-2);
  border-color:var(--hair);cursor:default;filter:none;box-shadow:none}
.btn.tonal{background:transparent;border-color:var(--ink)}
.btn.errbtn{background:transparent;border-color:var(--hair);color:var(--ink)}
.btn.txt{background:transparent;border:none;color:var(--ink);padding:0 16px;height:48px;
  text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;
  text-decoration-color:var(--hair);font-weight:700}
.btn.txt:active{background:transparent;opacity:.7}
.btn.full{width:100%}
/* the one key action on home: "Find my route", docked in the thumb zone */
.btn.cta{height:56px;width:100%;font-size:var(--fs-b);background:var(--red);color:var(--on-red);
  border-color:var(--red);font-weight:700}
.btn.cta:active{filter:brightness(.96)}
.cta-dock{position:sticky;z-index:6;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  background:var(--paper);padding:12px 0 8px;margin:12px 0 0;box-shadow:var(--sh-up);
  border-top:1px solid var(--hair)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;
  border-radius:999px;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);font-size:var(--fs-c);font-weight:700;cursor:pointer;
  position:relative;overflow:hidden;flex:none;
  transition:background .15s}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.chip .dot{width:12px;height:12px;border-radius:2px;flex:none}
.chip svg{width:17px;height:17px;fill:currentColor}
.chip.hilite{background:var(--apri-tint);border-color:var(--apri);color:var(--on-apri)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip.static{cursor:default;border-color:var(--hair);color:var(--ink-2);font-weight:400}
.chip.needs{border-style:dashed;border-color:var(--ink);color:var(--ink);font-weight:700}
/* ============ search bar — quiet field, never a blank screen ============ */
.searchbar{display:flex;align-items:center;gap:12px;height:56px;
  border-radius:var(--rad-l);
  border:1.5px solid var(--ink);background:var(--paper);padding:0 12px 0 16px;margin:16px 0 4px}
.searchbar svg{width:22px;height:22px;fill:var(--ink-2);flex:none}
.searchbar input{flex:1;border:none;background:transparent;outline:none;min-width:0;font-size:var(--fs-b)}
.searchbar input::placeholder{color:var(--ink-2)}
.searchbar .clear{width:36px;height:36px;border:none;background:transparent;border-radius:50%;
  color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.searchbar .clear svg{width:18px;height:18px;fill:currentColor}
/* ============ selects / inputs ============ */
.field{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.field label{font-size:var(--fs-c);font-weight:700;color:var(--ink-2);padding-left:2px;letter-spacing:.04em;text-transform:uppercase}
.field select,.field textarea,.field input{height:56px;
  border-radius:var(--rad-s);
  border:1.5px solid var(--ink);background:var(--paper);padding:0 16px;
  outline:none;width:100%;appearance:none}
.field textarea{height:112px;padding:12px 16px;resize:vertical}
.field select:focus,.field textarea:focus,.field input:focus{border-width:2px;padding-left:15.5px}
/* ============ segmented buttons ============ */
.seg{display:flex;border:1.5px solid var(--ink);border-radius:var(--rad-s);overflow:hidden;margin:8px 0}
.seg button{flex:1;height:48px;border:none;background:transparent;cursor:pointer;
  font-size:var(--fs-b);font-weight:400;color:var(--ink);position:relative;overflow:hidden}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--on-red);font-weight:700}
/* ============ route hero (detail) — the number does the talking ============ */
.hero{overflow:hidden;margin:16px 0 8px}
.hero .head{padding:8px 2px 16px;color:var(--ink);display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--hair)}
.hero .num{width:72px;height:72px;flex:none;display:flex;align-items:center;justify-content:center;
  background:transparent;border:2px solid var(--ink);color:var(--ink);
  border-radius:50%;font-weight:700;font-size:var(--fs-d);line-height:1;font-variant-numeric:tabular-nums}
.hero .head .nm{font-weight:700;font-size:var(--fs-t);line-height:1.2;letter-spacing:-.01em}
.hero .head .rt{font-size:var(--fs-c);color:var(--ink-2);margin-top:4px}
.hero .body{padding:8px 2px 4px}
/* ============ stops timeline — plain knots; next/dest carry a yellow knot ============ */
.timeline{position:relative;margin:8px 0 8px 8px}
.stop{display:flex;gap:16px;position:relative;padding-bottom:4px}
.stop .rail{width:20px;flex:none;display:flex;flex-direction:column;align-items:center}
.stop .rail .knot{width:16px;height:16px;border-radius:50%;
  border:2px solid var(--ink);background:var(--paper);z-index:1;margin-top:16px}
.stop .rail .knot.next{background:var(--apri);border-color:var(--ink)}
.stop .rail .knot.dest{background:var(--apri);border-color:var(--ink);box-shadow:var(--glow)}
.stop .rail .line{flex:1;width:2px;background:var(--hair);margin-top:-8px}
.stop .body{flex:1;padding:8px 0 12px;min-width:0}
.stop .t1{font-weight:700;font-size:var(--fs-b)}
.stop .t2{font-size:var(--fs-c);color:var(--ink-2)}
.stop .go{margin-top:8px}
/* ============ progress ============ */
.prog{height:12px;border-radius:999px;background:var(--tint);
  overflow:hidden;margin:12px 0 4px}
.prog>i{display:block;height:100%;background:var(--apri);border-radius:999px;transition:width .25s;width:0}
/* ============ bottom sheet ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;opacity:0;
  transition:opacity .2s;pointer-events:none}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  bottom:0;z-index:61;background:var(--paper);border-top:1px solid var(--hair);
  border-radius:var(--rad-l) var(--rad-l) 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));
  max-height:86dvh;overflow-y:auto;transition:transform .25s ease;transform:translate(-50%,105%);
  box-shadow:var(--sh-2)}
.sheet.show{transform:translate(-50%,0)}
.sheet .handle{width:36px;height:4px;border-radius:999px;background:var(--hair);margin:8px auto 12px}
.sheet h3{margin:0 0 8px;font-weight:700;font-size:var(--fs-t);line-height:1.2;letter-spacing:-.01em}
/* ============ snackbar ============ */
.snack{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--paper);
  padding:12px 20px;border-radius:999px;
  z-index:70;font-size:var(--fs-b);font-weight:400;max-width:min(92vw,480px);
  opacity:0;transition:all .2s;pointer-events:none;box-shadow:var(--sh-2)}
.snack.show{opacity:1;transform:translate(-50%,0)}
/* ============ status line — text first, quiet ============ */
.statusrow{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 0}
.stat{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-c);font-weight:400;color:var(--ink-2)}
.stat .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.stat.net-off{color:var(--ink);font-weight:700}
.stat.net-off .dot{background:transparent;border:2px solid currentColor}
.stat.pack-ok{color:var(--ink)}
.stat svg{width:14px;height:14px;fill:currentColor}
/* quiet pack status line under the home task */
.packline{display:flex;align-items:center;gap:8px;font-size:var(--fs-c);color:var(--ink-2);
  margin:12px 2px 0;padding:0}
.packline svg{width:16px;height:16px;fill:var(--apri);flex:none}
.packline b{color:var(--ink);font-weight:700}
.packline button{border:none;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair)}
/* ============ common destinations (home) ============ */
.dest .numchip{margin-top:4px}
/* ============ rich empty states — guidance, never a dead end ============ */
.empty2{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:32px 16px;margin:16px 0}
.empty2 .ring{width:64px;height:64px;border-radius:50%;background:var(--apri-tint);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.empty2 .ring svg{width:30px;height:30px;fill:var(--ink)}
.empty2 .t1{font-weight:700;font-size:var(--fs-t);line-height:1.25;max-width:22ch}
.empty2 .t2{font-size:var(--fs-b);color:var(--ink-2);margin:8px 0 0;max-width:30ch;line-height:1.45}
.empty2 .btn-row{justify-content:center;margin-top:16px}
/* ============ add-to-home-screen hint — 5% accent wash, dismissible ============ */
.a2hs{display:flex;align-items:center;gap:12px;border:1px solid var(--hair);background:var(--apri-hint);
  border-radius:var(--rad-l);padding:12px 8px 12px 16px;
  margin:24px 0 8px;position:relative}
.a2hs .ic{width:20px;height:20px;fill:var(--ink);flex:none}
.a2hs .t1{font-weight:700;font-size:var(--fs-b);line-height:1.3}
.a2hs .t2{font-size:var(--fs-c);color:var(--ink-2)}
.a2hs .x{margin-left:auto;flex:none;width:40px;height:40px;color:var(--ink-2)}
/* ============ map ============ */
.mapwrap{position:relative;margin:0 -16px;height:calc(100dvh - var(--nav-h) - 56px - env(safe-area-inset-top,0px) - 96px);
  background:var(--paper);border-bottom:1px solid var(--hair);overflow:hidden;touch-action:none;cursor:grab}
.mapwrap:active{cursor:grabbing}
#mapsvg{width:100%;height:100%;display:block;user-select:none}
.basemap image{filter:grayscale(1)}
@media (prefers-color-scheme: dark){ .basemap image{filter:grayscale(1) invert(.92) brightness(.9)} }
.map-attr{position:absolute;left:12px;bottom:8px;z-index:5;font-size:var(--fs-c);font-weight:400;
  color:var(--ink);background:var(--paper);border:1px solid var(--hair);border-radius:8px;padding:2px 8px}
.map-ctl{position:absolute;right:16px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:5}
.map-ctl .icon-btn{background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);
  border-radius:var(--rad-s);box-shadow:var(--sh-1)}
.mland{cursor:pointer;transform-box:fill-box;transform-origin:center}
.mland text{font-size:12.5px;font-weight:700;fill:var(--ink);
  paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
/* route states: ordinary lines black; the selected line is flag-red
   on a black casing — distinct by color AND width, badge inverts */
#mapg.hasSel path[data-route]:not(.sel){opacity:.35}
#mapg path[data-route].sel{stroke:var(--red)!important;stroke-width:4.4!important}
#mapg .term{fill:var(--ink)}
#mapg .term.sel{fill:var(--red);stroke:var(--ink);stroke-width:1.4}
#mapg .numbadge circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}
#mapg .numbadge text{fill:var(--ink);font-weight:700}
#mapg .numbadge.sel circle{fill:var(--red)}
#mapg .numbadge.sel text{fill:var(--on-red)}
.meloc-ring{transform-box:fill-box;transform-origin:center;animation:locpulse 1.8s ease-out infinite}
@keyframes locpulse{0%{transform:scale(.5);opacity:.8}70%{transform:scale(2.4);opacity:0}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion: reduce){.meloc-ring{animation:none;display:none}}
/* ============ trip ============ */
.trip-dest{display:flex;align-items:center;gap:16px;background:transparent;color:var(--ink);
  border:1.5px solid var(--ink);border-radius:var(--rad-l);
  padding:16px;margin:16px 0}
.trip-dest svg{width:24px;height:24px;fill:currentColor;flex:none}
.trip-dest .big{font-weight:700;font-size:var(--fs-t);line-height:1.25}
.trip-dest .sm{font-size:var(--fs-c);color:var(--ink-2)}
.trip-state{font-weight:700;font-size:var(--fs-t);text-align:center;padding:20px 8px;line-height:1.3;letter-spacing:-.01em}
.trip-state.approach{background:var(--apri-tint);border-radius:var(--rad-l);
  border-left:4px solid var(--apri);display:block;margin:0 auto;padding:16px}
.trip-state.arrived{background:var(--apri);color:var(--on-apri);border-radius:var(--rad-l);display:block;
  margin:0 auto;padding:24px 16px;box-shadow:var(--glow)}
.trip-state.arrived svg{width:44px;height:44px;fill:var(--on-apri);display:block;margin:0 auto 8px;
  animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.trip-state .sub{display:block;font-weight:400;font-size:var(--fs-b);margin-top:8px}
.trip-dist{font-size:var(--fs-b);color:var(--ink-2);text-align:center;margin-bottom:8px;font-weight:400;font-variant-numeric:tabular-nums}
/* ============ misc ============ */
.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 2px;font-size:var(--fs-b);border-bottom:1px solid var(--hair)}
.kv:last-child{border-bottom:none}
.kv b{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:var(--fs-c)}
.center{text-align:center}
.empty{padding:40px 16px;font-size:var(--fs-b);text-align:center;color:var(--ink-2)}
.empty svg{width:48px;height:48px;fill:var(--hair);margin-bottom:8px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--tint);
  border-top-color:var(--ink);animation:spin 1s linear infinite;display:inline-block;vertical-align:-5px}
@keyframes spin{to{transform:rotate(360deg)}}
.fadein{animation:viewin .25s ease}
a{color:var(--ink);text-decoration-thickness:1.5px;text-underline-offset:3px}
.ripple-ink{position:absolute;border-radius:50%;background:currentColor;opacity:.12;
  transform:scale(0);animation:rip .45s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.step{display:flex;gap:16px;margin:16px 0;align-items:flex-start}
.step .n{width:32px;height:32px;border-radius:50%;background:transparent;color:var(--ink);
  border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-b);font-weight:700;flex:none;margin-top:1px}
.step p{margin:4px 0;font-size:var(--fs-b)}
.step b{font-weight:700}
/* result rows reveal in a stagger (peak moment: the answer appears) */
.reveal{animation:rowin .32s cubic-bezier(.2,.8,.3,1) both}
@keyframes rowin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* favorite star pop */
.fav-pop{animation:favpop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes favpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:50%;border:none;background:var(--red);color:var(--on-red);
  box-shadow:var(--sh-2);z-index:35;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab svg{width:24px;height:24px;fill:currentColor}
.hidden{display:none!important}
</style>
</head>

<script>

  function findRoutes(from, to, box) {

/* =====================================================================
   TRIP (foreground alighting guidance)
   ===================================================================== */
async function viewTrip({ a, b }) {
  setAppbar(t('trip_title'), { back: true });
  const v = $('#view');
  const r = PACK && PACK.pack.routes.find(x => x.id === a);
  if (!r || !r.stops[+b]) { v.append(banner('err', 'i-error', t('trip_no_pack'))); return; }
  const dest = r.stops[+b], destIdx = +b;

  v.append(banner('warn', 'i-warn', t('trip_fg_only')));
  v.append(el('div', { class: 'trip-dest' }, icon('i-pin'),
    el('div', {}, el('div', { class: 'big' }, t('get_off_at') + ': ' + dest.name),
      el('div', { class: 'sm' }, r.name + ' · ' + t('fare')))));
  const stateBox = el('div', { class: 'card elev' }); v.append(stateBox);
  const listBox = el('div', {}); v.append(listBox);

  const stopFracs = r.stops.map(s => nearestFrac(r.shape, s));
  function nearestFrac(shape, p) {
    let bi = 0, bd = Infinity;
    shape.forEach((q, i) => { const dx = q[0] - p.lon, dy = q[1] - p.lat, d = dx * dx + dy * dy; if (d < bd) { bd = d; bi = i; } });
    return bi / (shape.length - 1);

    const R = 6371000, rad = x => x * Math.PI / 180;
    const dA = rad(a2 - a1), dO = rad(o2 - o1);
    const h = Math.sin(dA / 2) ** 2 + Math.cos(rad(a1)) * Math.cos(rad(a2)) * Math.sin(dO / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  if (!navigator.geolocation) { denied(); return; }
  stateBox.append(el('div', { class: 'trip-state' }, t('trip_locating')));
  /* journey progress — the red fill is the emphasized next segment */
  const prog = el('div', { class: 'prog', style: 'margin:14px 2px 2px' }, el('i'));
  const progLbl = el('p', { class: 'trip-dist', style: 'margin:2px 2px 10px' }, '');
  const progBox = el('div', {}, prog, progLbl);
  v.append(progBox);
  progBox.classList.add('hidden');
  TRIP.watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: false, maximumAge: 15000, timeout: 25000 });

  function onErr(err) {
    if (TRIP.watchId == null) return;
    navigator.geolocation.clearWatch(TRIP.watchId); TRIP.watchId = null;
    if (err && err.code === 1) denied();
    else { stateBox.innerHTML = ''; stateBox.append(el('div', { class: 'trip-state' }, t('locating')), el('p', { class: 'muted small center' }, t('error_generic'))); }
  }
  function denied() {
    stateBox.innerHTML = '';
    stateBox.append(banner('err', 'i-error', t('location_denied')),
      el('p', { class: 'card-sub' }, t('location_denied_desc')),
      el('div', { class: 'btn-row' }, el('button', { class: 'btn tonal', onclick: () => route() }, icon('i-locate'), t('retry'))));
  }
  function onPos(pos) {
    if (TRIP.watchId == null) return;
    const { longitude: lon, latitude: lat } = pos.coords;
    /* project onto shape: nearest vertex fraction */
    let bi = 0, bd = Infinity;
    r.shape.forEach((q, i) => { const dx = q[0] - lon, dy = q[1] - lat, d = dx * dx + dy * dy; if (d < bd) { bd = d; bi = i; } });
    const uf = bi / (r.shape.length - 1);
    const dvi = Math.round(stopFracs[destIdx] * (r.shape.length - 1));   // dest vertex index
    const dDest = haversine(lat, lon, dest.lat, dest.lon);
    /* next stop ahead of user along the trace */
    let nextIdx = r.stops.findIndex(s => stopFracs[r.stops.indexOf(s)] > uf + 0.004);
    const nextName = nextIdx >= 0 ? r.stops[nextIdx].name : r.stops[r.stops.length - 1].name;
    const atStop = dDest < 150 || Math.abs(bi - dvi) <= 1;               // reached the stop vertex
    stateBox.innerHTML = '';
    if (atStop) {
      /* end moment: arrival gets closure — check pop, yellow card, a word
         of encouragement (skill: never let the flow fall off) */
      stateBox.append(el('div', { class: 'trip-state arrived' }, icon('i-check'), t('trip_arrived'),
        el('span', { class: 'sub' }, t('trip_arrived_sub'))),
        el('p', { class: 'trip-dist' }, t('trip_away', { m: Math.round(dDest) })));
    } else if (nextName === dest.name) {
      stateBox.append(el('div', { class: 'trip-state approach' }, t('trip_approaching', { s: dest.name })),
        el('p', { class: 'trip-dist' }, t('trip_away', { m: Math.round(dDest) })));
    } else {
      stateBox.append(el('div', { class: 'trip-state' }, t('trip_next', { s: nextName })),
        el('p', { class: 'trip-dist' }, t('trip_away', { m: Math.round(dDest) })));
    }
    /* gentle progress emphasis: fraction of the journey completed */
    const destFrac = Math.max(stopFracs[destIdx], 0.0001);
    progBox.classList.remove('hidden');
    prog.firstElementChild.style.width = Math.min(100, Math.max(2, uf / destFrac * 100)) + '%';
    progLbl.textContent = `${t('board')}: ${r.stops[0].name} → ${t('get_off_at')}: ${dest.name}`;
    /* stop progress list — next stop red, destination flagged */
    listBox.innerHTML = '';
    const tl = el('div', { class: 'timeline' });
    r.stops.forEach((s, i) => {
      const here = s.name === nextName, isDest = i === destIdx;
      tl.append(el('div', { class: 'stop' },
        el('div', { class: 'rail' }, el('div', { class: 'knot' + (here ? ' next' : '') + (isDest ? ' dest' : '') }), i < r.stops.length - 1 ? el('div', { class: 'line' }) : null),
        el('div', { class: 'body' }, el('div', { class: 't1', style: here || isDest ? 'font-weight:700' : '' }, s.name + (isDest ? '  ·  ' + t('get_off_at') : '')))));
    });
    listBox.append(tl);
    if (!TRIP.finBtn) TRIP.finBtn = true;
  }
}

'use strict';

    const n = Math.pow(2, z);
    const xt = lo => Math.min(n - 1, Math.max(0, Math.floor((lo + 180) / 360 * n)));
    const yt = la => { const r = Math.max(-85, Math.min(85, la)) * Math.PI / 180; return Math.min(n - 1, Math.max(0, Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n))); };
    const corner = (tz, tx2, ty2) => { const lo = tx2 / Math.pow(2, tz) * 360 - 180; const rr = (1 - 2 * ty2 / Math.pow(2, tz)) * Math.PI; return [Math.atan(Math.sinh(rr)) * 180 / Math.PI, lo]; };
    const x0 = xt(loL), x1 = xt(loR), y0 = yt(laT), y1 = yt(laB);
    if ((x1 - x0 + 1) * (y1 - y0 + 1) > 64) { bg.innerHTML = ''; return; }
    const keep = new Set();
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
      const key = z + '/' + x + '/' + y; keep.add(key);
      if (bg.querySelector(`[data-t="${key}"]`)) continue;
      const [nla, nlo] = corner(z, x, y), [sla, slo] = corner(z, x + 1, y + 1);
      const [px, py] = MAP.proj(nla, nlo), [qx, qy] = MAP.proj(sla, slo);
      const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      img.setAttribute('x', px.toFixed(1)); img.setAttribute('y', py.toFixed(1));
      img.setAttribute('width', (qx - px).toFixed(1)); img.setAttribute('height', (qy - py).toFixed(1));
      img.setAttribute('href', `https://tile.openstreetmap.org/${z}/${x}/${y}.png`);
      img.setAttribute('data-t', key);
      img.addEventListener('error', () => img.remove());
      bg.append(img);
    }
    bg.querySelectorAll('image').forEach(im => { if (!keep.has(im.getAttribute('data-t'))) im.remove(); });
  }
  function applyT() {
    const g = svg.querySelector('#mapg'); if (!g) return;
    g.setAttribute('transform', `translate(${MAP.tx} ${MAP.ty}) scale(${MAP.k})`);
    scheduleBasemap();
  }
  function centerOn(x, y, k) {
    MAP.k = k || MAP.k;
    MAP.tx = MAP.W / 2 - MAP.k * x; MAP.ty = MAP.H / 2 - MAP.k * y;
    applyT();
  }

  /* ---------- chips: select a route (red) or show all (black) ---------- */
  chiprow.append(el('button', { class: 'chip', 'aria-pressed': 'true', onclick: () => { clearSel(); tweenView(MAP.W / 2, MAP.H / 2, 1); } }, t('all')));
  chiprow.append(el('button', { class: 'chip', 'aria-pressed': 'false', onclick: openFavs }, '★ ' + t('favorites')));
  for (const r of PACK.pack.routes) {
    const c = el('button', { class: 'chip', 'aria-pressed': 'false', 'aria-label': r.name, onclick: () => {
      cancelAnimationFrame(MAP.tweenId);
      if (MAP.sel === r.id) { clearSel(); return; }
      selectRoute(r.id, { draw: true });
      const bb = { lo1: 999, la1: 999, lo2: -999, la2: -999 };
      r.shape.forEach(p => { bb.lo1 = Math.min(bb.lo1, p[0]); bb.la1 = Math.min(bb.la1, p[1]); bb.lo2 = Math.max(bb.lo2, p[0]); bb.la2 = Math.max(bb.la2, p[1]); });
      const [x1, y1] = MAP.proj(bb.la2, bb.lo1), [x2, y2] = MAP.proj(bb.la1, bb.lo2);
      const k = Math.min(2.4, Math.min(MAP.W / Math.max(60, x2 - x1), MAP.H / Math.max(60, y2 - y1)) * 0.9);
      tweenView((x1 + x2) / 2, (y1 + y2) / 2, k);
    } }, String(r.number));
    chiprow.append(c);
  }

  /* ---------- pan & pinch ---------- */
  wrap.addEventListener('pointerdown', e => {
    cancelAnimationFrame(MAP.tweenId);
    try { wrap.setPointerCapture(e.pointerId); } catch (err) { /* pointer already inactive (e.g. synthetic events) */ }
    MAP.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    MAP.moved = false;
  });
  wrap.addEventListener('pointermove', e => {
    if (!MAP.pointers.has(e.pointerId)) return;
    const prev = MAP.pointers.get(e.pointerId);
    MAP.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (MAP.pointers.size === 1) {
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) MAP.moved = true;
      MAP.tx += dx; MAP.ty += dy; applyT();
    } else if (MAP.pointers.size === 2) {
      MAP.moved = true;
      const [p1, p2] = [...MAP.pointers.values()];
      const dNow = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      const r = wrap.getBoundingClientRect();
      const midX = (p1.x + p2.x) / 2 - r.left, midY = (p1.y + p2.y) / 2 - r.top;
      if (MAP.lastPinch) {
        const ratio = dNow / MAP.lastPinch.d;
        const nk = Math.min(8, Math.max(0.6, MAP.k * ratio));
        MAP.tx = midX - (midX - MAP.tx) * (nk / MAP.k);
        MAP.ty = midY - (midY - MAP.ty) * (nk / MAP.k);
        MAP.k = nk;
      }
      MAP.lastPinch = { d: dNow };
      applyT();
    }
  });
  const endPtr = e => {
    if (MAP.pointers.has(e.pointerId) && MAP.pointers.size === 1 && !MAP.moved) tap(e);
    MAP.pointers.delete(e.pointerId);
    MAP.lastPinch = null;
  };
  wrap.addEventListener('pointerup', endPtr);
  wrap.addEventListener('pointercancel', e => { MAP.pointers.delete(e.pointerId); MAP.lastPinch = null; });
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    cancelAnimationFrame(MAP.tweenId);
    const r = wrap.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const nk = Math.min(8, Math.max(0.6, MAP.k * (e.deltaY < 0 ? 1.15 : 0.87)));
    MAP.tx = mx - (mx - MAP.tx) * (nk / MAP.k); MAP.ty = my - (my - MAP.ty) * (nk / MAP.k);
    MAP.k = nk; applyT();
  }, { passive: false });
  function tap(e) {
    const tEl = document.elementFromPoint(e.clientX, e.clientY);
    const gp = tEl && tEl.closest && tEl.closest('[data-lm]');
    if (gp) {
      /* stop selection: brief enlarge, name is already labelled — no bouncing */
      if (!REDUCED && gp.animate) gp.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.45)' }, { transform: 'scale(1)' }],
        { duration: 280, easing: 'ease-out' });
      openLandmark(gp.getAttribute('data-lm'));
    }
  }

  function openLandmark(id) {
    const l = PACK.pack.landmarks.find(x => x.id === id); if (!l) return;
    const box = el('div', {},
      el('h3', { id: 'sheettitle' }, l.name),
      el('p', { class: 'muted small' }, `${l.lat.toFixed(4)}, ${l.lon.toFixed(4)} · © OpenStreetMap`),
      el('p', { class: 'card-sub', style: 'margin-top:6px;font-weight:600' }, t('landmark_served_by')));
    if (l.routes.length) {
      const chips = el('div', { class: 'chiprow', style: 'padding:6px 0' });
      for (const rid of l.routes) {
        const r = PACK.pack.routes.find(x => x.id === rid);
        chips.append(el('button', { class: 'chip', onclick: () => { closeSheet(); location.hash = '#/route/' + rid; } },
          el('b', { style: 'font-weight:700' }, String(r.number)), ' ' + r.name));
      }
      box.append(chips);
    } else box.append(el('p', { class: 'muted small' }, t('no_routes_serve')));
    box.append(el('div', { class: 'btn-row', style: 'justify-content:flex-end' }, el('button', { class: 'btn filled', onclick: closeSheet }, t('close'))));
    openSheet(box);
  }

  async function openFavs() {
    let favs = []; try { favs = await getFavs(); } catch (e) { }
    const box = el('div', {}, el('h3', { id: 'sheettitle' }, t('favorites')));
    if (!favs.length) box.append(emptyState('i-star', '', t('no_favs')));
    else {
      const rows = el('div', { style: 'margin:4px 0' });
      for (const fid of favs) {
        const r = PACK.pack.routes.find(x => x.id === fid); if (!r) continue;
        rows.append(el('button', { class: 'list-item', onclick: () => { closeSheet(); location.hash = '#/route/' + r.id; } },
          el('span', { class: 'lead sel', style: 'width:40px;height:40px' }, String(r.number)),
          el('span', { class: 'txt' },
            el('span', { class: 't1' }, r.name),
            el('span', { class: 't2' }, r.areas.join(' · '))),
          icon('i-right')));
      }
      box.append(rows);
    }
    box.append(el('div', { class: 'btn-row', style: 'justify-content:flex-end' }, el('button', { class: 'btn filled', onclick: closeSheet }, t('close'))));
    openSheet(box);
  }

  function locateMe() {
    if (!navigator.geolocation) { snack(t('location_denied')); return; }
    snack(t('locating'));
    navigator.geolocation.getCurrentPosition(pos => {
      const [x, y] = MAP.proj(pos.coords.latitude, pos.coords.longitude);
      marker.innerHTML = '';
      const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('r', 12);
      ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', 'var(--apri)'); ring.setAttribute('stroke-width', '2.5');
      ring.setAttribute('opacity', '.5');
      ring.setAttribute('class', 'meloc-ring');
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', 6);
      dot.setAttribute('fill', 'var(--ink)'); dot.setAttribute('stroke', 'var(--paper)'); dot.setAttribute('stroke-width', '2.5');
      marker.append(ring, dot); marker.style.display = '';
      tweenView(x, y, Math.max(MAP.k, 2));
    }, () => snack(t('location_denied')), { enableHighAccuracy: false, timeout: 15000, maximumAge: 30000 });
  }
}

/* =====================================================================
   boot
   ===================================================================== */
(async function boot() {
  document.documentElement.lang = LANG;
  try { const mql = window.matchMedia('(prefers-color-scheme: dark)'); if (mql.addEventListener) mql.addEventListener('change', renderStatusChips); } catch (e) { }
  renderNav('routes');
  await loadPack();
  route();
  initSW();
})();

</script>
</body>
</html>
